# SPA: static files from Vite build (dist/), fallback to index.html for client-side routes.
# API and WebSocket calls go to VITE_API_URL in the browser (no reverse proxy here).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache hashed assets; adjust if you add non-hashed filenames under /assets/
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
